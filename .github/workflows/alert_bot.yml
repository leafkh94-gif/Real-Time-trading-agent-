name: Trading Alert Bot

# Coverage on a PUBLIC repo (unlimited free Actions minutes).
#
# How it works:
#   * Each run executes the bot, which scans every 30 min via its internal
#     loop, then exits after MAX_RUNTIME_S so the journal artifact uploads.
#   * Bot state + signal journal are carried across runs via actions/cache
#     (cache keys are immutable, so each run saves a fresh key and the next
#     run restores the newest via the restore-keys prefix).
#   * THE CRON IS THE RESTART MECHANISM, not a watchdog. The self-chain step
#     below has never once produced a run: GitHub deliberately does not create
#     a workflow run from a workflow_dispatch made with the built-in
#     GITHUB_TOKEN (recursion prevention). All 959 runs to date carry
#     `event: schedule`; not one carries `event: workflow_dispatch` from the
#     chain. The header used to claim "guaranteed handoff with no gap".
#   * Because the cron is the real restart, MAX_RUNTIME_S sets the coverage.
#     At 90 minutes the bot was UP for 90 min and then DOWN until the next
#     cron tick actually fired — measured gaps of 46 min to 3h51m, roughly
#     33% uptime. Scheduled workflows are best-effort and are routinely
#     delayed well past the tick. The run duration now nearly spans the gap
#     instead of relying on the tick being punctual.
#   * concurrency group prevents duplicate runners if two triggers overlap.

on:
  workflow_dispatch:        # manual start / restart from the Actions tab
  schedule:
    - cron: '0 * * * *'    # recovery watchdog: hourly

concurrency:
  group: trading-bot
  cancel-in-progress: false  # never kill the live run; let the new one queue

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # GitHub's job ceiling is 6h; stay under it

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore bot state + signal journal
        uses: actions/cache/restore@v4
        with:
          path: |
            .bot_state.json
            signal_journal.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run alert bot
        run: python longterm_bot.py
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL_API_KEY:     ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER:  ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD:    ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_DEMO:        "true"
          # Exit cleanly after 90 min so the artifact/cache steps actually run.
          # Without this the loop ran until GitHub killed the job at the 355-min
          # timeout, which cancels the run — every completed run so far shows
          # zero executed jobs and uploaded no journal. The self-chain restarts
          # immediately, so coverage is unaffected.
          # 5h30m, inside the 355-minute job timeout so the exit is graceful
          # and the journal upload step still runs. Was 5400 (90 min), chosen
          # so the journal uploaded often — but that traded a diagnostic
          # artifact for two thirds of the bot's uptime, because nothing
          # restarted it promptly. The journal now uploads every 5.5h instead,
          # which is ample for something read once a day.
          MAX_RUNTIME_S:       "19800"

      - name: Save bot state + signal journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .bot_state.json
            signal_journal.json
          key: bot-state-${{ github.run_id }}

      # Cache is the only persistence path and evicts after 7 idle days.
      # The artifact makes the journal downloadable and recoverable by hand —
      # it does NOT make it durable. Artifact names must be unique: v4 errors
      # on duplicates and this workflow self-chains continuously.
      - name: Upload journal for offline analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ github.run_id }}
          path: |
            signal_journal.json
            .bot_state.json
          retention-days: 90
          if-no-files-found: warn

      # Kept, but it does NOT work with the built-in token and never has —
      # GitHub suppresses workflow runs from a dispatch made with
      # GITHUB_TOKEN. It is left in place because it starts working the moment
      # a real PAT (repo + workflow scope) is stored as CHAIN_TOKEN, which
      # would close the remaining gap between cron ticks. Until then the cron
      # is the restart. What changed here is that it no longer LIES: `curl -s`
      # with no status check printed "Next run queued." unconditionally, which
      # is why a chain that had never fired looked healthy in every log.
      - name: Self-chain — attempt to queue the next run
        if: always()
        run: |
          code=$(curl -s -o /tmp/chain.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CHAIN_TOKEN || secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/alert_bot.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch HTTP $code"
          cat /tmp/chain.out || true
          if [ "$code" != "204" ]; then
            echo "::warning::Self-chain dispatch returned $code — the cron is the only restart."
          else
            echo "Dispatch accepted (204). NOTE: with GITHUB_TOKEN this still"
            echo "produces no run; check for a new run before trusting it."
          fi
