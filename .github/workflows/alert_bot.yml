name: Trading Alert Bot

# Reliable 24/7 coverage on a PUBLIC repo (unlimited free Actions minutes).
#
# How it works:
#   * Each run executes longterm_bot.py, which scans every 30 min via its
#     internal loop. The runner timeout ends the run; the self-chain restarts it.
#   * Bot state + signal journal are carried across runs via actions/cache
#     (cache keys are immutable, so each run saves a fresh key and the next
#     run restores the newest via the restore-keys prefix).
#   * At the end of each run a "self-chain" step triggers the next run via
#     the GitHub API — guaranteed handoff with no gap.
#   * The schedule cron is a recovery-only watchdog: if the chain ever dies,
#     the next tick (worst-case ~60 min) restarts it automatically.
#   * concurrency group prevents duplicate runners if cron and self-chain overlap.

on:
  workflow_dispatch:        # manual start / restart from the Actions tab
  schedule:
    - cron: '0 * * * *'    # recovery watchdog: hourly

concurrency:
  group: trading-bot
  cancel-in-progress: false  # never kill the live run; let the new one queue

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # hard ceiling; self-chain restarts after this

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore bot state + signal journal
        uses: actions/cache/restore@v4
        with:
          path: |
            .bot_state.json
            signal_journal.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run alert bot
        run: python longterm_bot.py
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL_API_KEY:     ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER:  ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD:    ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_DEMO:        "true"
          # Exit cleanly after 90 min so the artifact/cache steps actually run.
          # Without this the loop ran until GitHub killed the job at the 355-min
          # timeout, which cancels the run — every completed run so far shows
          # zero executed jobs and uploaded no journal. The self-chain restarts
          # immediately, so coverage is unaffected.
          MAX_RUNTIME_S:       "5400"

      - name: Save bot state + signal journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .bot_state.json
            signal_journal.json
          key: bot-state-${{ github.run_id }}

      # Cache is the only persistence path and evicts after 7 idle days.
      # The artifact makes the journal downloadable and recoverable by hand —
      # it does NOT make it durable. Artifact names must be unique: v4 errors
      # on duplicates and this workflow self-chains continuously.
      - name: Upload journal for offline analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ github.run_id }}
          path: |
            signal_journal.json
            .bot_state.json
          retention-days: 90
          if-no-files-found: warn

      - name: Self-chain — queue the next run immediately
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/alert_bot.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Next run queued."
