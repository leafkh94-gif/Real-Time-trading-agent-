name: Strategy Backtest

# Run the full 1-year backtest on demand.
# Results are uploaded as a downloadable artifact (backtest_results.csv).
#
# How to use:
#   1. Go to Actions tab → "Strategy Backtest" → "Run workflow"
#   2. Wait ~3-5 minutes for it to finish
#   3. Download "backtest-results" artifact from the completed run

on:
  workflow_dispatch:
    inputs:
      forward_bars:
        description: 'H1 bars to check after signal (48 = 2 days, 72 = 3 days)'
        required: false
        default: '48'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-alerts.txt

      - name: Run backtest
        run: |
          python backtest.py \
            --forward-bars ${{ github.event.inputs.forward_bars || 48 }} \
            --save-csv \
            2>&1 | tee backtest_output.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: |
            backtest_results.csv
            backtest_output.txt
          retention-days: 30
