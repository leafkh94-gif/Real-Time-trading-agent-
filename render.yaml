services:
  - type: web
    name: longterm-smc-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python longterm_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ACCOUNT_SIZE
        value: "1000"
      - key: RISK_PCT
        value: "0.01"
      - key: ENTER_SCORE
        value: "70"
      - key: ENVIRONMENT
        value: development
